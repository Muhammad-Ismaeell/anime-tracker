version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: anime-tracker-backend

    ports:
      - "8000:8000"

    volumes:
      - ..:/app

    env_file:
      - .env

    working_dir: /app/backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
