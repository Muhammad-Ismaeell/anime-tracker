name: Frontend Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: anime-frontend

    env:
      VITE_GOOGLE_CLIENT_ID: ci-placeholder
      VITE_API_URL: http://127.0.0.1:8000/api
      VITE_MEDIA_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anime-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
